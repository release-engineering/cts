apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cts-integration-test-eaas-
  labels:
    appstudio.openshift.io/application: cts
spec:
  workspaces:
  - name: source
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  pipelineSpec:
    description: |
      Integration test for CTS using Konflux EaaS (Environment as a Service).
      Clones the repository, provisions an ephemeral namespace, and deploys
      CTS with PostgreSQL for testing.

    params:
    - name: SNAPSHOT
      description: JSON string representing the snapshot under test
      type: string

    workspaces:
    - name: source
      description: Shared workspace for the cloned CTS repository

    tasks:
    - name: test-metadata
      taskSpec:
        params:
        - name: SNAPSHOT
          type: string
        results:
        - name: image-url
          description: Container image URL to test
        - name: ldap-server-image-url
          description: Container image URL for the pre-built LDAP server
        - name: ldap-server-present
          description: Whether the ldap-server component is present in the Snapshot
        - name: git-url
          description: Git repository URL
        - name: git-revision
          description: >-
            Git revision (commit SHA) to clone: the PaC annotation SHA when
            present (component-specific run), otherwise the Snapshot revision
            (group test where all components share the same commit).
        steps:
        - name: extract-metadata
          image: quay.io/konflux-ci/appstudio-utils:latest
          env:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
          - name: PAC_SHA
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/sha']
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            echo "Parsing snapshot..."

            # Extract image URL
            IMAGE_URL=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .containerImage')
            echo -n "$IMAGE_URL" | tee $(results.image-url.path)
            echo ""
            echo "Image to test: $IMAGE_URL"

            # Extract ldap-server image URL. If the ldap-server component is absent
            # from the Snapshot (e.g. no ldap-server build was triggered for this PR
            # because no relevant files changed, and no stable build exists yet), set
            # ldap-server-present to "false" so the test pipeline is skipped rather
            # than trying to pull a non-existent image.
            LDAP_SERVER_IMAGE_URL=$(echo "$SNAPSHOT" | jq -r '(.components[] | select(.name=="ldap-server") | .containerImage) // empty')
            if [ -z "$LDAP_SERVER_IMAGE_URL" ]; then
              echo "ldap-server not found in Snapshot; skipping integration test"
              echo -n "" | tee $(results.ldap-server-image-url.path)
              echo -n "false" | tee $(results.ldap-server-present.path)
            else
              echo -n "$LDAP_SERVER_IMAGE_URL" | tee $(results.ldap-server-image-url.path)
              echo -n "true" | tee $(results.ldap-server-present.path)
            fi
            echo ""
            echo "LDAP server image: $LDAP_SERVER_IMAGE_URL"
            echo ""

            # Extract git repository URL
            GIT_URL=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .source.git.url')
            echo -n "$GIT_URL" | tee $(results.git-url.path)
            echo ""
            echo "Git URL: $GIT_URL"

            # Select the git revision to clone.
            # PAC_SHA (from the Downward API) is the exact commit that triggered this
            # PipelineRun when testing a single component (e.g. ldap-server). In that
            # case the Snapshot's cts revision still points to the last main-branch
            # commit, which may not yet have groups.ldif. For group tests the
            # annotation is absent and the Snapshot revision is the right choice.
            SNAPSHOT_REVISION=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .source.git.revision')
            if [ -n "$PAC_SHA" ]; then
              GIT_REVISION="$PAC_SHA"
              echo "Using SHA from PaC annotation: $GIT_REVISION"
            else
              GIT_REVISION="$SNAPSHOT_REVISION"
              echo "PaC annotation absent; using Snapshot git-revision: $GIT_REVISION"
            fi
            echo -n "$GIT_REVISION" | tee $(results.git-revision.path)
            echo ""
            echo "Git revision: $GIT_REVISION"
      params:
      - name: SNAPSHOT
        value: $(params.SNAPSHOT)

    - name: clone-repo
      runAfter:
      - test-metadata
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: git-url
          type: string
        - name: git-revision
          type: string
        steps:
        - name: clone
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            DEST="$(workspaces.source.path)/cts-repo"
            git clone --depth 1 "$(params.git-url)" "$DEST"
            git -C "$DEST" fetch --depth 1 origin "$(params.git-revision)"
            git -C "$DEST" checkout FETCH_HEAD
      params:
      - name: git-url
        value: $(tasks.test-metadata.results.git-url)
      - name: git-revision
        value: $(tasks.test-metadata.results.git-revision)

    - name: provision-environment
      runAfter:
      - test-metadata
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      taskRef:
        params:
        - name: name
          value: eaas-provision-space
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-eaas-provision-space:0.1
        - name: kind
          value: task
        resolver: bundles
      params:
      - name: ownerKind
        value: PipelineRun
      - name: ownerName
        value: $(context.pipelineRun.name)
      - name: ownerUid
        value: $(context.pipelineRun.uid)

    - name: deploy-openldap
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        - name: ldap-server-image
          type: string
        steps:
        - name: create-openldap
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/deploy-manifests.sh"

            setup_kubeconfig "$(params.kubeconfig-secret)"

            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            DATA="$(workspaces.source.path)/cts-repo/integration-tests/data"
            deploy_openldap "$MANIFESTS" "$(params.ldap-server-image)" "$DATA"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)
      - name: ldap-server-image
        value: $(tasks.test-metadata.results.ldap-server-image-url)

    - name: deploy-dex
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-dex
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/dex-tls.sh"
            . "$SCRIPTS/deploy-manifests.sh"

            setup_kubeconfig "$(params.kubeconfig-secret)"

            echo "=========================================="
            echo "Generating Dex TLS certificate"
            echo "=========================================="

            TMPDIR=$(mktemp -d)
            generate_dex_tls "$TMPDIR"
            rm -rf "$TMPDIR"
            echo "✓ Dex TLS certificate generated"

            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            deploy_dex_manifests "$MANIFESTS"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-kafka
      runAfter:
      - provision-environment
      - clone-repo
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-kafka
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/deploy-manifests.sh"

            setup_kubeconfig "$(params.kubeconfig-secret)"

            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            deploy_kafka "$MANIFESTS"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-database
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-database
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/deploy-manifests.sh"

            setup_kubeconfig "$(params.kubeconfig-secret)"

            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            deploy_postgres "$MANIFESTS"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-cts
      runAfter:
      - deploy-database
      - deploy-openldap
      - deploy-dex
      - deploy-kafka
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        - name: image-url
          type: string
        steps:
        - name: create-service
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/deploy-cts.sh"

            setup_kubeconfig "$(params.kubeconfig-secret)"

            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            deploy_cts "$MANIFESTS" "$(params.image-url)"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)
      - name: image-url
        value: $(tasks.test-metadata.results.image-url)

    - name: run-tests
      runAfter:
      - deploy-cts
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        results:
        - name: test-result
          description: Test execution result
        steps:
        - name: execute-tests
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SCRIPTS="$(workspaces.source.path)/cts-repo/integration-tests/scripts"
            . "$SCRIPTS/kubeconfig.sh"
            . "$SCRIPTS/pytest-cmd.sh"

            echo "=========================================="
            echo "Running Integration Tests"
            echo "=========================================="

            setup_kubeconfig "$(params.kubeconfig-secret)"

            # Get the namespace
            NAMESPACE=$(kubectl config view --minify -o jsonpath='{..namespace}')
            echo "Ephemeral namespace: $NAMESPACE"
            echo ""

            echo "Creating test runner pod in namespace: $NAMESPACE"

            # Retrieve the Dex CA cert so the test runner pod can trust Dex over HTTPS
            DEX_CA_B64=$(kubectl get secret dex-ca -o jsonpath='{.data.ca\.crt}')

            # Create a test runner pod in the target namespace (using appstudio-utils which has git and python)
            kubectl run cts-test-runner \
              --image=quay.io/konflux-ci/appstudio-utils:latest \
              --namespace=$NAMESPACE \
              --restart=Never \
              --command -- sleep 3600

            # Wait for pod to be ready
            echo "Waiting for test runner pod to be ready..."
            kubectl wait --for=condition=Ready pod/cts-test-runner -n $NAMESPACE --timeout=60s

            echo ""
            echo "Copying pre-cloned repository into test runner pod..."
            kubectl cp "$(workspaces.source.path)/cts-repo" \
              $NAMESPACE/cts-test-runner:/tmp/cts-repo

            echo ""
            echo "Running tests in pod..."
            echo "CTS URL: http://cts:8080"
            echo ""

            # Run the tests - temporarily disable exit-on-error to capture result
            set +e
            kubectl exec cts-test-runner -n $NAMESPACE -- bash -c "
              set -ex
              export HOME=/tmp

              echo 'Installing Dex CA certificate...'
              echo '$DEX_CA_B64' | base64 -d > /tmp/dex-ca.crt

              echo 'Installing pytest, requests, and kafka-python...'
              python3 -m ensurepip
              python3 -m pip install --target /tmp/test-deps --quiet pytest requests kafka-python

              echo ''
              echo 'Running pytest...'
              export PYTHONPATH=/tmp/test-deps
              $(declare -f run_pytest)
              run_pytest /tmp/cts-repo /tmp/dex-ca.crt
            "
            TEST_RESULT=$?
            set -e

            # Clean up test runner pod
            echo ""
            echo "Cleaning up test runner pod..."
            kubectl delete pod cts-test-runner -n $NAMESPACE --ignore-not-found=true

            if [ $TEST_RESULT -eq 0 ]; then
              echo ""
              echo "✓ All tests passed!"
              echo "passed" | tee $(results.test-result.path)
              exit 0
            else
              echo ""
              echo "✗ Tests failed!"
              echo "failed" | tee $(results.test-result.path)

              # Show CTS pod logs for debugging
              echo ""
              echo "=========================================="
              echo "CTS Pod Logs (last 50 lines):"
              echo "=========================================="

              CTS_POD=$(kubectl get pod -l app=cts -n $NAMESPACE -o jsonpath='{.items[0].metadata.name}')
              kubectl logs $CTS_POD -n $NAMESPACE --tail=50 || true

              exit 1
            fi
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    finally:
    - name: report-result
      params:
      - name: ldap-server-present
        value: $(tasks.test-metadata.results.ldap-server-present)
      - name: test-result
        value: $(tasks.run-tests.results.test-result)
      taskSpec:
        params:
        - name: ldap-server-present
          type: string
        - name: test-result
          type: string
          default: ""
        results:
        - name: test-output
          description: Final test output result
        steps:
        - name: emit-result
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            if [ "$(params.ldap-server-present)" = "false" ]; then
              echo "ldap-server image was not available in the Snapshot; test skipped."
              echo -n "skipped" | tee $(results.test-output.path)
            else
              echo -n "$(params.test-result)" | tee $(results.test-output.path)
            fi

    results:
    - name: TEST_OUTPUT
      value: $(finally.report-result.results.test-output)
