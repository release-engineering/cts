apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cts-integration-test-eaas-
  labels:
    appstudio.openshift.io/application: cts
spec:
  workspaces:
  - name: source
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  pipelineSpec:
    description: |
      Integration test for CTS using Konflux EaaS (Environment as a Service).
      Clones the repository, provisions an ephemeral namespace, and deploys
      CTS with PostgreSQL for testing.

    params:
    - name: SNAPSHOT
      description: JSON string representing the snapshot under test
      type: string

    workspaces:
    - name: source
      description: Shared workspace for the cloned CTS repository

    tasks:
    - name: test-metadata
      taskSpec:
        params:
        - name: SNAPSHOT
          type: string
        results:
        - name: image-url
          description: Container image URL to test
        - name: ldap-server-image-url
          description: Container image URL for the pre-built LDAP server
        - name: ldap-server-present
          description: Whether the ldap-server component is present in the Snapshot
        - name: git-url
          description: Git repository URL
        - name: git-revision
          description: >-
            Git revision (commit SHA) to clone: the PaC annotation SHA when
            present (component-specific run), otherwise the Snapshot revision
            (group test where all components share the same commit).
        steps:
        - name: extract-metadata
          image: quay.io/konflux-ci/appstudio-utils:latest
          env:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
          - name: PAC_SHA
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['pac.test.appstudio.openshift.io/sha']
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            echo "Parsing snapshot..."

            # Extract image URL
            IMAGE_URL=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .containerImage')
            echo -n "$IMAGE_URL" | tee $(results.image-url.path)
            echo ""
            echo "Image to test: $IMAGE_URL"

            # Extract ldap-server image URL. If the ldap-server component is absent
            # from the Snapshot (e.g. no ldap-server build was triggered for this PR
            # because no relevant files changed, and no stable build exists yet), set
            # ldap-server-present to "false" so the test pipeline is skipped rather
            # than trying to pull a non-existent image.
            LDAP_SERVER_IMAGE_URL=$(echo "$SNAPSHOT" | jq -r '(.components[] | select(.name=="ldap-server") | .containerImage) // empty')
            if [ -z "$LDAP_SERVER_IMAGE_URL" ]; then
              echo "ldap-server not found in Snapshot; skipping integration test"
              echo -n "" | tee $(results.ldap-server-image-url.path)
              echo -n "false" | tee $(results.ldap-server-present.path)
            else
              echo -n "$LDAP_SERVER_IMAGE_URL" | tee $(results.ldap-server-image-url.path)
              echo -n "true" | tee $(results.ldap-server-present.path)
            fi
            echo ""
            echo "LDAP server image: $LDAP_SERVER_IMAGE_URL"
            echo ""

            # Extract git repository URL
            GIT_URL=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .source.git.url')
            echo -n "$GIT_URL" | tee $(results.git-url.path)
            echo ""
            echo "Git URL: $GIT_URL"

            # Select the git revision to clone.
            # PAC_SHA (from the Downward API) is the exact commit that triggered this
            # PipelineRun when testing a single component (e.g. ldap-server). In that
            # case the Snapshot's cts revision still points to the last main-branch
            # commit, which may not yet have groups.ldif. For group tests the
            # annotation is absent and the Snapshot revision is the right choice.
            SNAPSHOT_REVISION=$(echo "$SNAPSHOT" | jq -r '.components[] | select(.name=="cts") | .source.git.revision')
            if [ -n "$PAC_SHA" ]; then
              GIT_REVISION="$PAC_SHA"
              echo "Using SHA from PaC annotation: $GIT_REVISION"
            else
              GIT_REVISION="$SNAPSHOT_REVISION"
              echo "PaC annotation absent; using Snapshot git-revision: $GIT_REVISION"
            fi
            echo -n "$GIT_REVISION" | tee $(results.git-revision.path)
            echo ""
            echo "Git revision: $GIT_REVISION"
      params:
      - name: SNAPSHOT
        value: $(params.SNAPSHOT)

    - name: clone-repo
      runAfter:
      - test-metadata
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: git-url
          type: string
        - name: git-revision
          type: string
        steps:
        - name: clone
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            DEST="$(workspaces.source.path)/cts-repo"
            git clone --depth 1 "$(params.git-url)" "$DEST"
            git -C "$DEST" fetch --depth 1 origin "$(params.git-revision)"
            git -C "$DEST" checkout FETCH_HEAD
      params:
      - name: git-url
        value: $(tasks.test-metadata.results.git-url)
      - name: git-revision
        value: $(tasks.test-metadata.results.git-revision)

    - name: provision-environment
      runAfter:
      - test-metadata
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      taskRef:
        params:
        - name: name
          value: eaas-provision-space
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-eaas-provision-space:0.1
        - name: kind
          value: task
        resolver: bundles
      params:
      - name: ownerKind
        value: PipelineRun
      - name: ownerName
        value: $(context.pipelineRun.name)
      - name: ownerUid
        value: $(context.pipelineRun.uid)

    - name: deploy-openldap
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        - name: ldap-server-image
          type: string
        steps:
        - name: create-openldap
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            echo "=========================================="
            echo "Deploying LDAP Server (pre-built image)"
            echo "=========================================="

            LDAP_IMAGE="$(params.ldap-server-image)"
            echo "Using LDAP server image: $LDAP_IMAGE"

            echo "Creating ldap-data ConfigMap from cloned repository..."
            kubectl create configmap ldap-data \
              --from-file=groups.ldif="$(workspaces.source.path)/cts-repo/integration-tests/data/groups.ldif"

            sed "s|\${LDAP_IMAGE}|${LDAP_IMAGE}|g" \
              "$(workspaces.source.path)/cts-repo/integration-tests/manifests/openldap.yaml" \
              > /tmp/openldap-rendered.yaml
            kubectl apply -f /tmp/openldap-rendered.yaml

            echo "Waiting for LDAP server to be ready..."
            if ! kubectl wait --for=condition=available --timeout=180s deployment/openldap; then
              echo "LDAP deployment failed! Debug info:"
              kubectl describe deployment openldap
              kubectl describe pod -l app=openldap
              kubectl logs -l app=openldap --tail=50 || echo "No logs available"
              exit 1
            fi
            echo "✓ LDAP server is ready"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)
      - name: ldap-server-image
        value: $(tasks.test-metadata.results.ldap-server-image-url)

    - name: deploy-dex
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-dex
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            echo "=========================================="
            echo "Generating Dex TLS certificate"
            echo "=========================================="

            # Generate a self-signed CA and Dex server certificate (SAN: DNS:dex)
            # so that OIDCOAuthVerifyJwksUri can use https://dex:5556/keys
            TMPDIR=$(mktemp -d)

            # Generate CA key and cert
            openssl genrsa -out "$TMPDIR/ca.key" 4096 2>/dev/null
            openssl req -x509 -new -nodes -key "$TMPDIR/ca.key" \
              -sha256 -days 365 \
              -subj "/CN=dex-test-ca" \
              -out "$TMPDIR/ca.crt" 2>/dev/null

            # Generate Dex server key and CSR
            openssl genrsa -out "$TMPDIR/dex.key" 4096 2>/dev/null
            openssl req -new -key "$TMPDIR/dex.key" \
              -subj "/CN=dex" \
              -out "$TMPDIR/dex.csr" 2>/dev/null

            # Sign the Dex cert with the CA, adding SAN for DNS:dex
            cat > "$TMPDIR/dex.ext" <<'EXTEOF'
            [SAN]
            subjectAltName=DNS:dex
            EXTEOF
            openssl x509 -req -in "$TMPDIR/dex.csr" \
              -CA "$TMPDIR/ca.crt" -CAkey "$TMPDIR/ca.key" -CAcreateserial \
              -out "$TMPDIR/dex.crt" -days 365 -sha256 \
              -extfile "$TMPDIR/dex.ext" -extensions SAN 2>/dev/null

            # Store CA cert and Dex TLS cert/key in Kubernetes Secrets
            kubectl create secret generic dex-tls \
              --from-file=tls.crt="$TMPDIR/dex.crt" \
              --from-file=tls.key="$TMPDIR/dex.key"

            kubectl create secret generic dex-ca \
              --from-file=ca.crt="$TMPDIR/ca.crt"

            rm -rf "$TMPDIR"
            echo "✓ Dex TLS certificate generated"

            echo "=========================================="
            echo "Deploying Dex OIDC Provider"
            echo "=========================================="

            kubectl apply -f "$(workspaces.source.path)/cts-repo/integration-tests/manifests/dex-config.yaml"

            kubectl apply -f "$(workspaces.source.path)/cts-repo/integration-tests/manifests/dex.yaml"

            echo "Waiting for Dex to be ready..."
            if ! kubectl wait --for=condition=available --timeout=180s deployment/dex; then
              echo "Dex deployment failed! Debug info:"
              kubectl describe deployment dex
              kubectl describe pod -l app=dex
              kubectl logs -l app=dex --tail=50 || echo "No logs available"
              exit 1
            fi
            echo "✓ Dex is ready"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-kafka
      runAfter:
      - provision-environment
      - clone-repo
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-kafka
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            echo "=========================================="
            echo "Deploying Kafka (Apache KRaft single-node)"
            echo "=========================================="

            kubectl apply -f "$(workspaces.source.path)/cts-repo/integration-tests/manifests/kafka.yaml"

            echo "Waiting for Kafka to be ready..."
            if ! kubectl wait --for=condition=available --timeout=300s deployment/kafka; then
              echo "Kafka deployment failed! Debug info:"
              kubectl describe deployment kafka
              kubectl describe pod -l app=kafka
              kubectl logs -l app=kafka --tail=50 || echo "No logs available"
              exit 1
            fi
            echo "✓ Kafka is ready"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-database
      runAfter:
      - provision-environment
      - clone-repo
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        steps:
        - name: create-database
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            # Get kubeconfig from secret
            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            echo "=========================================="
            echo "Deploying PostgreSQL Database"
            echo "=========================================="

            # Deploy PostgreSQL
            kubectl apply -f "$(workspaces.source.path)/cts-repo/integration-tests/manifests/postgres.yaml"

            echo "Waiting for database to be ready..."

            # Check pod status first
            echo ""
            echo "Pod status:"
            kubectl get pods -l app=cts-db

            echo ""
            echo "Deployment status:"
            kubectl get deployment cts-db

            # Wait with more detailed output on failure
            if ! kubectl wait --for=condition=available --timeout=180s deployment/cts-db; then
              echo ""
              echo "=========================================="
              echo "Database deployment failed! Debug info:"
              echo "=========================================="

              echo ""
              echo "Deployment details:"
              kubectl describe deployment cts-db

              echo ""
              echo "Pod details:"
              kubectl describe pod -l app=cts-db

              echo ""
              echo "Pod logs (if available):"
              kubectl logs -l app=cts-db --tail=100 || echo "No logs available"

              echo ""
              echo "Events:"
              kubectl get events --sort-by='.lastTimestamp'

              exit 1
            fi

            echo "✓ Database is ready"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    - name: deploy-cts
      runAfter:
      - deploy-database
      - deploy-openldap
      - deploy-dex
      - deploy-kafka
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        - name: image-url
          type: string
        steps:
        - name: create-service
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            # Get kubeconfig from secret
            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            IMAGE="$(params.image-url)"

            echo "=========================================="
            echo "Deploying CTS Service"
            echo "=========================================="
            echo "Image: $IMAGE"

            # Create ConfigMap with production configuration and httpd config for CTS
            MANIFESTS="$(workspaces.source.path)/cts-repo/integration-tests/manifests"
            kubectl create configmap cts-config \
              --from-file=config.py="${MANIFESTS}/config.py" \
              --from-file=httpd.conf="${MANIFESTS}/httpd.conf" \
              --dry-run=client -o yaml | kubectl apply -f -

            # Deploy CTS
            sed "s|\${IMAGE}|${IMAGE}|g" \
              "$(workspaces.source.path)/cts-repo/integration-tests/manifests/cts.yaml" \
              > /tmp/cts-rendered.yaml
            kubectl apply -f /tmp/cts-rendered.yaml

            echo "Waiting for CTS service to be ready..."

            # Check pod status first
            echo ""
            echo "Pod status:"
            kubectl get pods -l app=cts

            echo ""
            echo "Deployment status:"
            kubectl get deployment cts

            # Wait with more detailed output on failure
            if ! kubectl wait --for=condition=available --timeout=300s deployment/cts; then
              echo ""
              echo "=========================================="
              echo "CTS deployment failed! Debug info:"
              echo "=========================================="

              echo ""
              echo "Deployment details:"
              kubectl describe deployment cts

              echo ""
              echo "Pod details:"
              kubectl describe pod -l app=cts

              echo ""
              echo "CTS Pod logs (if available):"
              kubectl logs -l app=cts --tail=100 || echo "No logs available"

              echo ""
              echo "Database pod status (for reference):"
              kubectl get pod -l app=cts-db

              echo ""
              echo "Events:"
              kubectl get events --sort-by='.lastTimestamp' | tail -30

              exit 1
            fi

            echo ""
            echo "✓ CTS service is ready"
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)
      - name: image-url
        value: $(tasks.test-metadata.results.image-url)

    - name: run-tests
      runAfter:
      - deploy-cts
      when:
      - input: $(tasks.test-metadata.results.ldap-server-present)
        operator: in
        values:
        - "true"
      workspaces:
      - name: source
        workspace: source
      taskSpec:
        workspaces:
        - name: source
        params:
        - name: kubeconfig-secret
          type: string
        results:
        - name: test-result
          description: Test execution result
        steps:
        - name: execute-tests
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            echo "=========================================="
            echo "Running Integration Tests"
            echo "=========================================="

            # Get kubeconfig
            KUBECONFIG=/tmp/kubeconfig
            kubectl get secret $(params.kubeconfig-secret) -o jsonpath='{.data.kubeconfig}' | base64 -d > $KUBECONFIG
            export KUBECONFIG

            # Get the namespace
            NAMESPACE=$(kubectl config view --minify -o jsonpath='{..namespace}')
            echo "Ephemeral namespace: $NAMESPACE"
            echo ""

            echo "Creating test runner pod in namespace: $NAMESPACE"

            # Retrieve the Dex CA cert so the test runner pod can trust Dex over HTTPS
            DEX_CA_B64=$(kubectl get secret dex-ca -o jsonpath='{.data.ca\.crt}')

            # Create a test runner pod in the target namespace (using appstudio-utils which has git and python)
            kubectl run cts-test-runner \
              --image=quay.io/konflux-ci/appstudio-utils:latest \
              --namespace=$NAMESPACE \
              --restart=Never \
              --command -- sleep 3600

            # Wait for pod to be ready
            echo "Waiting for test runner pod to be ready..."
            kubectl wait --for=condition=Ready pod/cts-test-runner -n $NAMESPACE --timeout=60s

            echo ""
            echo "Copying pre-cloned repository into test runner pod..."
            kubectl cp "$(workspaces.source.path)/cts-repo" \
              $NAMESPACE/cts-test-runner:/tmp/cts-repo

            echo ""
            echo "Running tests in pod..."
            echo "CTS URL: http://cts:8080"
            echo ""

            # Run the tests - temporarily disable exit-on-error to capture result
            set +e
            kubectl exec cts-test-runner -n $NAMESPACE -- bash -c "
              set -ex
              export HOME=/tmp

              echo 'Installing Dex CA certificate...'
              echo '$DEX_CA_B64' | base64 -d > /tmp/dex-ca.crt

              echo 'Installing pytest, requests, and kafka-python...'
              python3 -m ensurepip
              python3 -m pip install --target /tmp/test-deps --quiet pytest requests kafka-python

              echo ''
              echo 'Running pytest...'
              cd /tmp/cts-repo
              PYTHONPATH=/tmp/test-deps REQUESTS_CA_BUNDLE=/tmp/dex-ca.crt CTS_URL=http://cts:8080 AUTH_BACKEND=oidc_or_kerberos DEX_URL=https://dex:5556 KAFKA_URL=kafka:9092 python3 -m pytest tests/test_integration_api.py -v -o addopts=
            "
            TEST_RESULT=$?
            set -e

            # Clean up test runner pod
            echo ""
            echo "Cleaning up test runner pod..."
            kubectl delete pod cts-test-runner -n $NAMESPACE --ignore-not-found=true

            if [ $TEST_RESULT -eq 0 ]; then
              echo ""
              echo "✓ All tests passed!"
              echo "passed" | tee $(results.test-result.path)
              exit 0
            else
              echo ""
              echo "✗ Tests failed!"
              echo "failed" | tee $(results.test-result.path)

              # Show CTS pod logs for debugging
              echo ""
              echo "=========================================="
              echo "CTS Pod Logs (last 50 lines):"
              echo "=========================================="

              CTS_POD=$(kubectl get pod -l app=cts -n $NAMESPACE -o jsonpath='{.items[0].metadata.name}')
              kubectl logs $CTS_POD -n $NAMESPACE --tail=50 || true

              exit 1
            fi
      params:
      - name: kubeconfig-secret
        value: $(tasks.provision-environment.results.secretRef)

    finally:
    - name: report-result
      params:
      - name: ldap-server-present
        value: $(tasks.test-metadata.results.ldap-server-present)
      - name: test-result
        value: $(tasks.run-tests.results.test-result)
      taskSpec:
        params:
        - name: ldap-server-present
          type: string
        - name: test-result
          type: string
          default: ""
        results:
        - name: test-output
          description: Final test output result
        steps:
        - name: emit-result
          image: quay.io/konflux-ci/appstudio-utils:latest
          script: |
            #!/usr/bin/env bash
            if [ "$(params.ldap-server-present)" = "false" ]; then
              echo "ldap-server image was not available in the Snapshot; test skipped."
              echo -n "skipped" | tee $(results.test-output.path)
            else
              echo -n "$(params.test-result)" | tee $(results.test-output.path)
            fi

    results:
    - name: TEST_OUTPUT
      value: $(finally.report-result.results.test-output)
