apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
      - name: openldap
        image: ${LDAP_IMAGE}
        ports:
        - containerPort: 1389
          name: ldap
        readinessProbe:
          tcpSocket:
            port: 1389
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: ldap-data
          mountPath: /etc/ldap-data
          readOnly: true
      volumes:
      - name: ldap-data
        configMap:
          name: ldap-data
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  ports:
  - port: 1389
    targetPort: 1389
    name: ldap
  selector:
    app: openldap
